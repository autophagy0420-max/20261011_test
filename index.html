
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 청소당번 추첨</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                         sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 40px 28px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(30, 41, 59, 0.12);
            text-align: center;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(25px, 5vw, 36px);
            color: #4338ca;
        }

        .description {
            margin-bottom: 30px;
            color: #64748b;
            line-height: 1.7;
        }

        .settings {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .setting {
            padding: 12px 18px;
            background: #f1f5f9;
            border-radius: 14px;
            font-weight: bold;
        }

        .setting span {
            color: #4f46e5;
            font-size: 20px;
        }

        .draw-button {
            width: 100%;
            max-width: 320px;
            padding: 17px 24px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.25);
            transition: transform 0.2s, opacity 0.2s;
        }

        .draw-button:hover {
            transform: translateY(-2px);
        }

        .draw-button:active {
            transform: scale(0.98);
        }

        .draw-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .result-title {
            margin: 36px 0 18px;
            font-size: 23px;
        }

        .result {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
        }

        .student-card {
            padding: 20px 4px;
            border: 2px solid #e0e7ff;
            border-radius: 16px;
            background: #eef2ff;
            animation: appear 0.4s ease both;
        }

        .student-card .number {
            display: block;
            font-size: clamp(23px, 5vw, 34px);
            font-weight: 800;
            color: #4338ca;
        }

        .student-card .label {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            color: #64748b;
        }

        .empty-message {
            grid-column: 1 / -1;
            padding: 30px 12px;
            color: #94a3b8;
            background: #f8fafc;
            border-radius: 16px;
        }

        .history {
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
            text-align: left;
        }

        .history h3 {
            margin: 0 0 12px;
            font-size: 17px;
        }

        .history p {
            margin: 8px 0;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
        }

        .reset-button {
            margin-top: 16px;
            padding: 10px 18px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #475569;
            cursor: pointer;
        }

        .reset-button:hover {
            background: #f1f5f9;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 16px;
            }

            .result {
                gap: 6px;
            }

            .student-card {
                padding: 16px 2px;
                border-radius: 12px;
            }

            .student-card .label {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🧹</div>

        <h1>우리 반 청소당번 추첨</h1>

        <p class="description">
            공정한 랜덤 추첨으로<br>
            오늘의 청소당번 5명을 선정합니다!
        </p>

        <div class="settings">
            <div class="setting">
                전체 학생 <span>30명</span>
            </div>
            <div class="setting">
                선정 인원 <span>5명</span>
            </div>
        </div>

        <button class="draw-button" id="drawButton"
                onclick="drawStudents()">
            🎲 청소당번 뽑기
        </button>

        <h2 class="result-title" id="resultTitle">
            오늘의 청소당번
        </h2>

        <section class="result" id="result"
                 aria-live="polite" aria-label="추첨 결과">
            <div class="empty-message">
                버튼을 눌러 청소당번을 뽑아보세요!
            </div>
        </section>

        <section class="history">
            <h3>📋 추첨 기록</h3>
            <div id="historyList">
                <p>아직 추첨 기록이 없습니다.</p>
            </div>

            <button class="reset-button" onclick="resetHistory()">
                기록 초기화
            </button>
        </section>
    </main>

    <script>
        const TOTAL_STUDENTS = 30;
        const SELECT_COUNT = 5;

        let drawCount = 0;

        // 1부터 30까지의 학생 번호 중 5명을 중복 없이 추첨
        function drawStudents() {
            const button = document.getElementById("drawButton");
            const result = document.getElementById("result");
            const resultTitle = document.getElementById("resultTitle");

            button.disabled = true;
            button.textContent = "🎲 추첨 중...";

            // Fisher-Yates 셔플 알고리즘
            const students = Array.from(
                { length: TOTAL_STUDENTS },
                (_, index) => index + 1
            );

            for (let i = students.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [students[i], students[j]] = [students[j], students[i]];
            }

            const selected = students.slice(0, SELECT_COUNT);

            // 결과를 작은 카드로 표시
            result.innerHTML = "";

            selected.forEach((student, index) => {
                const card = document.createElement("div");
                card.className = "student-card";
                card.style.animationDelay = `${index * 0.12}s`;

                const number = document.createElement("span");
                number.className = "number";
                number.textContent = student + "번";

                const label = document.createElement("span");
                label.className = "label";
                label.textContent = "청소당번";

                card.append(number, label);
                result.appendChild(card);
            });

            resultTitle.textContent = "🎉 오늘의 청소당번 발표!";

            drawCount++;
            addHistory(selected);

            button.disabled = false;
            button.textContent = "🔄 다시 뽑기";
        }

        // 추첨 기록 추가
        function addHistory(selected) {
            const historyList = document.getElementById("historyList");

            // 첫 추첨 시 안내 문구 제거
            if (drawCount === 1) {
                historyList.innerHTML = "";
            }

            const entry = document.createElement("p");
            const title = document.createElement("strong");
            title.textContent = `${drawCount}회차: `;
            entry.appendChild(title);
            entry.appendChild(
                document.createTextNode(selected.join("번, ") + "번")
            );

            historyList.prepend(entry);
        }

        // 추첨 기록 초기화
        function resetHistory() {
            const historyList = document.getElementById("historyList");

            drawCount = 0;
            historyList.innerHTML = "";

            const message = document.createElement("p");
            message.textContent = "아직 추첨 기록이 없습니다.";
            historyList.appendChild(message);
        }
    </script>
</body>
</html>
